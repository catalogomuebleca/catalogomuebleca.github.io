    /* 3. ESTILOS DE NIEVE Y ARBOLITOS (Esto era lo que faltaba) */
    .adorno-navidad {
      position: fixed;
      top: -30px;
      z-index: 9999;
      user-select: none;
      pointer-events: none;
      animation: caer linear forwards;
    }

      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }

  <!-- 4. SCRIPT DE NIEVE Y ARBOLITOS -->
  <script>
    const figuras = ['❄️', '❅', '🎄', '✨'];

    function crearAdorno() {
      const adorno = document.createElement('div');
      adorno.classList.add('adorno-navidad');
      adorno.innerText = figuras[Math.floor(Math.random() * figuras.length)];
      adorno.style.left = Math.random() * 100 + 'vw';
      adorno.style.fontSize = (Math.random() * 12 + 14) + 'px';
      
      const duracion = Math.random() * 5 + 5;
      adorno.style.animationDuration = duracion + 's';
      adorno.style.opacity = Math.random() * 0.5 + 0.5;

      document.body.appendChild(adorno);

      setTimeout(() => {
        adorno.remove();
      }, duracion * 1000);
    }

    setInterval(crearAdorno, 800);
  </script>
