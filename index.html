<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Muebleca</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: #222;
      background: #f4eef8 url("fondo1.jpg") center/cover fixed no-repeat;
      line-height: 1.5;
    }

    /* MENÚ SUPERIOR CON COLORES LLAMATIVOS */
    header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(90deg, #6a1b9a 0%, #d81b60 100%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      padding: 12px 14px;
      text-align: center;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 8px;
    }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    nav a {
      text-decoration: none;
      color: #222222;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      background: #ffca28; /* Amarillo dorado llamativo */
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }
    nav a:hover {
      background: #ffffff;
      color: #d81b60;
      transform: translateY(-2px);
    }

    .contenedor { max-width: 960px; margin: 20px auto; padding: 0 12px; }
    section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 14px; padding: 20px 14px; margin-bottom: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    h1, h2 { text-align: center; color: #6a1b9a; font-size: 1.4rem; margin-bottom: 4px; }
    .sub { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 16px; }

    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (max-width: 600px) {
      .galeria { grid-template-columns: 1fr; }
    }
    .galeria a { display: block; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
    .galeria img { width: 100%; height: auto; display: block; }
    .oculto { display: none !important; }

    /* BOTÓN DE MÁS PÁGINAS EN COLOR ROJO */
    .btn-mas {
      display: block;
      margin: 22px auto 0;
      padding: 13px 30px;
      background: #e53935; /* Rojo vibrante */
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 57, 53, 0.35);
      transition: background 0.2s, transform 0.2s;
    }
    .btn-mas:hover {
      background: #b71c1c;
      transform: scale(1.03);
    }

    video { width: 100%; max-width: 800px; margin: 0 auto; display: block; border-radius: 10px; }
    footer { text-align: center; padding: 16px; background: rgba(255,255,255,0.9); font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>

  <header>
    <div class="logo">CATÁLOGO MUEBLECA</div>
    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="#compras">Rutas Locales y Metodos de Compra</a>
      <a href="#rutas">Rutas Foráneas</a>
      <a href="#video">Video</a>
    </nav>
  </header>

  <main class="contenedor">
    <!-- 1. CATÁLOGO -->
    <section id="catalogo">

      <p class="sub">Toca cualquier hoja para abrirla sola y acercar con tus dedos</p>

        <a href="CAT 06.jpg" class="oculto"><img src="CAT 06.jpg" alt="Catálogo 06" loading="lazy"></a>
        <a href="CAT 07.jpg" class="oculto"><img src="CAT 07.jpg" alt="Catálogo 07" loading="lazy"></a>
        <a href="CAT 08.jpg" class="oculto"><img src="CAT 08.jpg" alt="Catálogo 08" loading="lazy"></a>
        <a href="CAT 09.jpg" class="oculto"><img src="CAT 09.jpg" alt="Catálogo 09" loading="lazy"></a>
        <a href="CAT 10.jpg" class="oculto"><img src="CAT 10.jpg" alt="Catálogo 10" loading="lazy"></a>
        <a href="CAT 11.jpg" class="oculto"><img src="CAT 11.jpg" alt="Catálogo 11" loading="lazy"></a>
        <a href="CAT 12.jpg" class="oculto"><img src="CAT 12.jpg" alt="Catálogo 12" loading="lazy"></a>
        <a href="CAT 13.jpg" class="oculto"><img src="CAT 13.jpg" alt="Catálogo 13" loading="lazy"></a>
        <a href="CAT 14.jpg" class="oculto"><img src="CAT 14.jpg" alt="Catálogo 14" loading="lazy"></a>
        <a href="CAT 15.jpg" class="oculto"><img src="CAT 15.jpg" alt="Catálogo 15" loading="lazy"></a>
        <a href="CAT 16.jpg" class="oculto"><img src="CAT 16.jpg" alt="Catálogo 16" loading="lazy"></a>
        <a href="CAT 17.jpg" class="oculto"><img src="CAT 17.jpg" alt="Catálogo 17" loading="lazy"></a>
        <a href="CAT 18.jpg" class="oculto"><img src="CAT 18.jpg" alt="Catálogo 18" loading="lazy"></a>
        <a href="CAT 19.jpg" class="oculto"><img src="CAT 19.jpg" alt="Catálogo 19" loading="lazy"></a>
        <a href="CAT 20.jpg" class="oculto"><img src="CAT 20.jpg" alt="Catálogo 20" loading="lazy"></a>
        <a href="CAT 21.jpg" class="oculto"><img src="CAT 21.jpg" alt="Catálogo 21" loading="lazy"></a>
        <a href="CAT 22.jpg" class="oculto"><img src="CAT 22.jpg" alt="Catálogo 22" loading="lazy"></a>

        <a href="CAT 29.jpg" class="oculto"><img src="CAT 29.jpg" alt="Catálogo 29" loading="lazy"></a>
        <a href="CAT 30.jpg" class="oculto"><img src="CAT 30.jpg" alt="Catálogo 30" loading="lazy"></a>
      </div>
      <button class="btn-mas" id="btn-mas" onclick="mostrarMas()">Ver más hojas del catálogo</button>
    </section>

    <!-- 2. RUTAS LOCALES, ENTREGAS Y COMPRAS (AHORA ARRIBA) -->
    <section id="compras">
      <h2>Rutas Locales, Entregas y Metodos de compra</h2>
      <div class="galeria">
        <a href="ENTREGAS.jpg"><img src="ENTREGAS.jpg" alt="Entregas" loading="lazy"></a>
        <a href="PASOS PARA COMPRAS.jpeg"><img src="PASOS PARA COMPRAS.jpeg" alt="Pasos para compras" loading="lazy"></a>
        <a href="SHOPING.jpg"><img src="SHOPING.jpg" alt="Shopping" loading="lazy"></a>
      </div>
    </section>

    <!-- 3. RUTAS FORÁNEAS (AHORA ABAJO) -->
    <section id="rutas">
      <h2>Información sobre Rutas Foráneas</h2>
      <div class="galeria">
        <a href="RUTFOR.jpg"><img src="RUTFOR.jpg" alt="Rutas Foráneas" loading="lazy"></a>
      </div>
    </section>

    <!-- 4. VIDEO -->
    <section id="video">
      <h2>Conoce Más de Nosotros</h2>
      <video src="video muebleca1.mp4" preload="none" poster="CAT 00.jpg" controls playsinline></video>
    </section>
  </main>

  <footer>Catálogo Muebleca &copy; 2026</footer>

  <script>
    function mostrarMas() {
      const ocultas = document.querySelectorAll('#lista-cat .oculto');
      for (let i = 0; i < 6 && i < ocultas.length; i++) {
        ocultas[i].classList.remove('oculto');
      }
      if (document.querySelectorAll('#lista-cat .oculto').length === 0) {
        document.getElementById('btn-mas').style.display = 'none';
      }
    }
  </script>
</body>
</html>
